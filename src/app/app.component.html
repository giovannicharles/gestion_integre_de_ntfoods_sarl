<app-preloader></app-preloader>
<app-toast-container></app-toast-container>
@if (network.offlineMessage()) {
  <div class="app-offline-banner" role="status">
    <i class="fa-solid fa-wifi-slash"></i>
    <span>{{ network.offlineMessage() }}</span>
  </div>
}
<app-update-banner></app-update-banner>
<router-outlet></router-outlet>
@if (auth.isAuthenticated() && chatbotContext().module !== 'DG') {
  <!-- DG a déjà son propre écran IA dédié (/dg/chat, bulle flottante "fab-ai") - éviter les deux
       à la fois serait une duplication, pas un service rendu. -->
  <app-chatbot [context]="chatbotContext()" title="Assistant IA TantyAI"></app-chatbot>
}
