@if (isOpen()) {
  <div class="confirm-backdrop" (click)="onCancel()">
    <div class="confirm-container {{ variantClass() }}" (click)="$event.stopPropagation()">
      <div class="confirm-header">
        <div class="confirm-icon">
          @if (variant() === 'danger') {
            <i class="fa-solid fa-triangle-exclamation"></i>
          } @else if (variant() === 'warning') {
            <i class="fa-solid fa-circle-exclamation"></i>
          } @else {
            <i class="fa-solid fa-circle-question"></i>
          }
        </div>
        <h3 class="confirm-title">{{ title() }}</h3>
      </div>
      <div class="confirm-body">
        <p class="confirm-message">{{ message() }}</p>
      </div>
      <div class="confirm-footer">
        <button class="btn btn-secondary" (click)="onCancel()">{{ cancelText() }}</button>
        <button class="btn btn-primary {{ variantClass() }}" (click)="onConfirm()">{{ confirmText() }}</button>
      </div>
    </div>
  </div>
}
