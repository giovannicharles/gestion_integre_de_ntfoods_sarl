<div *ngIf="loading" class="preloader-overlay" role="status" aria-live="polite" aria-busy="true">
  <div class="preloader-grid-bg" aria-hidden="true"></div>

  <div class="preloader-content">
    <div class="preloader-logo">
      <img src="/logo_tanty.jpg" alt="TANTY Logo" class="logo-image" />
    </div>

    <div class="preloader-loader" aria-hidden="true">
      @for (cell of loaderCells; track $index) {
        <span class="loader-cell" [style.animation-delay.ms]="cell * 60"></span>
      }
    </div>

    <div class="preloader-slogan">
      <p class="slogan-text">Grâce à vous nous sommes N°1, Merci</p>
    </div>
    <div class="preloader-text">
      <p>Chargement...</p>
    </div>
  </div>
</div>
