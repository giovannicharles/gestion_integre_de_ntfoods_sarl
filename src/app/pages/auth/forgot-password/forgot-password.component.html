<div class="forgot-container">
    <div class="forgot-card">
        <div class="forgot-header">
            <div class="logo-section">
                <img src="/logo_tanty.jpg" alt="TANTY Logo" class="logo-image" />
            </div>
            <h1 *ngIf="!submitted">Mot de passe oublié ?</h1>
            <h1 *ngIf="submitted">Email envoyé !</h1>
            <p *ngIf="!submitted">Entrez votre email pour recevoir un code de réinitialisation</p>
            <p *ngIf="submitted">Un code de réinitialisation a été envoyé à votre email</p>
        </div>

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="forgot-form" *ngIf="!submitted">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" formControlName="email" placeholder="votre@email.com"
                    [class.is-error]="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid" />
                <div class="error-message" *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid">
                    Email invalide
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-full" [disabled]="forgotForm.invalid || loading">
                    <span *ngIf="!loading">Envoyer le code</span>
                    <span *ngIf="loading" class="spinner spinner-sm"></span>
                </button>
            </div>

            <div class="form-footer">
                <a (click)="goToLogin()" class="back-link">
                    ← Retour à la connexion
                </a>
            </div>
        </form>

        <div class="success-message" *ngIf="submitted">
            <div class="success-icon">✓</div>
            <p>Vérifiez votre email et entrez le code reçu.</p>
            <button (click)="goToLogin()" class="btn btn-primary btn-full">
                Retour à la connexion
            </button>
        </div>
    </div>
</div>
