<div class="reset-container">
  <div class="reset-card">
    <div class="reset-header">
      <div class="logo-section">
        <img src="/logo_tanty.jpg" alt="TANTY Logo" class="logo-image" />
      </div>
      <h1>Nouveau mot de passe</h1>
      <p>Créez votre nouveau mot de passe sécurisé</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="reset-form">
      <div class="form-group">
        <label class="form-label">Nouveau mot de passe</label>
        <div class="password-input">
          <input [type]="showPassword ? 'text' : 'password'" class="form-control" formControlName="password"
            placeholder="••••••••"
            [class.is-error]="resetForm.get('password')?.touched && resetForm.get('password')?.invalid" />
          <button type="button" class="toggle-password" (click)="togglePassword()">
            <i [class]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
        <div class="error-message" *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.invalid">
          Le mot de passe doit contenir au moins 8 caractères
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirmer le mot de passe</label>
        <div class="password-input">
          <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control"
            formControlName="confirmPassword" placeholder="••••••••"
            [class.is-error]="resetForm.get('confirmPassword')?.touched && (resetForm.get('confirmPassword')?.invalid || resetForm.errors?.['passwordMismatch'])" />
          <button type="button" class="toggle-password" (click)="toggleConfirmPassword()">
            <i [class]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
        <div class="error-message"
          *ngIf="resetForm.get('confirmPassword')?.touched && resetForm.errors?.['passwordMismatch']">
          Les mots de passe ne correspondent pas
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-full" [disabled]="resetForm.invalid || loading">
          <span *ngIf="!loading">Réinitialiser</span>
          <span *ngIf="loading" class="spinner spinner-sm"></span>
        </button>
      </div>

      <div class="form-footer">
        <a (click)="goToLogin()" class="back-link">
          ← Retour à la connexion
        </a>
      </div>
    </form>
  </div>
</div>
