<div class="notifications-container animate-fadeInUp">
  <!-- HEADER -->
  <div class="ph">
    <div class="ph-left">
      <div class="ph-icon"><i class="fa-solid fa-bell"></i></div>
      <div>
        <h1 class="ph-title">Notifications</h1>
        <p class="ph-sub">{{ unreadCount }} non lue{{ unreadCount > 1 ? 's' : '' }}</p>
      </div>
    </div>
    <div class="ph-actions">
      <button class="btn btn-ghost btn-sm" (click)="markAllAsRead()" [disabled]="unreadCount === 0">
        <i class="fa-solid fa-check-double"></i> Tout marquer comme lu
      </button>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="notification-filters">
    <button class="filter-btn" [class.active]="filterType === 'all'" (click)="setFilter('all')">
      Toutes
    </button>
    <button class="filter-btn" [class.active]="filterType === 'unread'" (click)="setFilter('unread')">
      Non lues
    </button>
    <button class="filter-btn" [class.active]="filterType === 'warning'" (click)="setFilter('warning')">
      Alertes
    </button>
    <button class="filter-btn" [class.active]="filterType === 'success'" (click)="setFilter('success')">
      Succès
    </button>
  </div>

  <!-- NOTIFICATIONS LIST -->
  <div class="notifications-list">
    @for (notification of getFilteredNotifications(); track notification.id) {
      <div class="notification-item {{ getNotificationClass(notification.type) }}" [class.unread]="!notification.read">
        <div class="notif-icon">
          <i class="fa-solid {{ notification.icon }}"></i>
        </div>
        <div class="notif-content">
          <div class="notif-header">
            <span class="notif-title">{{ notification.title }}</span>
            <span class="notif-time">{{ notification.time }}</span>
          </div>
          <p class="notif-message">{{ notification.message }}</p>
        </div>
        <div class="notif-actions">
          @if (!notification.read) {
            <button class="action-btn" (click)="markAsRead(notification)" title="Marquer comme lu">
              <i class="fa-solid fa-check"></i>
            </button>
          }
          <button class="action-btn" (click)="deleteNotification(notification.id)" title="Supprimer">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </div>
    } @empty {
      <div class="empty-state">
        <i class="fa-solid fa-bell-slash"></i>
        <p>Aucune notification</p>
      </div>
    }
  </div>
</div>
